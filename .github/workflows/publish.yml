name: Publish to PyPI

# Fires when you publish a GitHub Release and publishes the package to PyPI.
# Zenodo DOI minting is not a dependency of this workflow or its PyPI publish.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
